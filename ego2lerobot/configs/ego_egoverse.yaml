# Example pipeline for EgoVerse (Zarr v3) episodes.
#
# One sub-dataset directory is one episode, and its zarr.json is the unique
# discovery anchor:
#
#   2025-09-20-17-42-51-000000/
#     zarr.json                 # embodiment / fps / task_name / features
#     right.obs_ee_pose/        # (T, 7) float64
#     left.obs_ee_pose/         # (T, 7) float64
#     obs_head_pose/            # (T, 7) float64
#     obs_eye_gaze/             # (T, 3) float64
#     obs_rgb_timestamps_ns/    # (T,) int64
#     images.front_1/           # (T,) variable-length JPEG bytes
#
# Run:
#   python -m ego2lerobot convert -c ego2lerobot/configs/ego_egoverse.yaml \
#       --root /path/to/egoverse --include '**/zarr.json' \
#       --ray-address auto --workers 8 --aggregate

version: 1

repo_id: ego/egoverse_demo
output_root: /tmp/ego_egoverse_demo/output
fps: 30                      # must match the sub-dataset's attrs.fps
robot_type: ego_egoverse

task:
  source: attrs.task_description
  default: ego manipulation

features:
  # Single-arm state for the example.  For bimanual data, concatenate left +
  # right (see the note in reader.arrays below) or add a composed source.
  observation.state:
    dtype: float32
    shape: [14]
    source:  [obs.ee_pose_left, obs.ee_pose_right]
    combine: concat
    key_name:
      [left_x, left_y, left_z, left_qx, left_qy, left_qz, left_qw,
       right_x, right_y, right_z, right_qx, right_qy, right_qz, right_qw]
    transforms:
      - op: astype
        dtype: float32

  # Action is the next frame's concatenated left + right end-effector pose:
  # action[t] = concat(left[t+1], right[t+1]); the last frame reuses its own.
  # (state_to_action is equivalent to the low-level `lookahead: 1`.)
  action:
    dtype: float32
    shape: [14]
    sources: [obs.ee_pose_left, obs.ee_pose_right]
    combine: concat
    key_name:
      [left_x, left_y, left_z, left_qx, left_qy, left_qz, left_qw,
       right_x, right_y, right_z, right_qx, right_qy, right_qz, right_qw]
    transforms:
      - op: state_to_action
      - op: astype
        dtype: float32

  observation.images.front:
    dtype: image
    shape: [480, 640, 3]
    source: cameras.front
    key_name: [height, width, channels]
    transforms:
      - op: as_image
        dtype: uint8
        channel_order: HWC

  observation.state.ee_pose_left:
    dtype: float32
    shape: [7]
    source: obs.ee_pose_left
    key_name: [left_x, left_y, left_z, left_qx, left_qy, left_qz, left_qw]
    transforms:
      - op: astype
        dtype: float32

  observation.state.ee_pose_right:
    dtype: float32
    shape: [7]
    source: obs.ee_pose_right
    key_name: [right_x, right_y, right_z, right_qx, right_qy, right_qz, right_qw]
    transforms:
      - op: astype
        dtype: float32

  observation.state.head_pose:
    dtype: float32
    shape: [7]
    source: obs.head_pose
    key_name: [head_x, head_y, head_z, head_qx, head_qy, head_qz, head_qw]
    transforms:
      - op: astype
        dtype: float32

  observation.state.eye_gaze:
    dtype: float32
    shape: [3]
    source: obs.eye_gaze
    key_name: [gaze_x, gaze_y, gaze_z]
    transforms:
      - op: astype
        dtype: float32

  observation.state.hand_left_world:
    dtype: float32
    shape: [21, 3]
    source: obs.obs_keypoints_left
    # key_name for shape [21, 3] takes 63 entries (row-major) or 21 nested
    # [x, y, z] rows, e.g. [[j0_x, j0_y, j0_z], [j1_x, ...], ...].
    transforms:
      - op: reshape
        shape: [21, 3]
      - op: astype
        dtype: float32

  observation.state.hand_right_world:
    dtype: float32
    shape: [21, 3]
    source: obs.obs_keypoints_right
    transforms:
      - op: reshape
        shape: [21, 3]
      - op: astype
        dtype: float32

reader:
  type: ego_egoverse

  # source -> zarr member name.  Set `arrays: null` to auto-detect every
  # numeric member; an explicit mapping keeps source names stable and avoids
  # loading large unused arrays.
  arrays:
    obs.ee_pose_left: left.obs_ee_pose
    obs.ee_pose_right: right.obs_ee_pose
    obs.head_pose: obs_head_pose
    obs.eye_gaze: obs_eye_gaze
    obs.timestamps_ns: obs_rgb_timestamps_ns
    obs.obs_keypoints_left: left.obs_keypoints
    obs.obs_keypoints_right: right.obs_keypoints

  # Set `images: null` to auto-detect image members (name starts with
  # "images." or the feature dtype is jpeg/png/image/video).
  images:
    cameras.front: images.front_1

  annotations: false         # true -> parse into attrs["annotations"]
  start: 0
  stop: null
  stride: 1
  decode_images: true        # false -> hand back raw encoded bytes

writer:
  use_videos: false
  image_writer_threads: 2
